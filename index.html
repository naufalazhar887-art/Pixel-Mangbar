</head>
<body class="flex flex-col items-center justify-center min-h-screen text-white overflow-hidden p-2 sm:p-4">

    <div class="w-full max-w-4xl flex flex-col items-center">

            <div id="game-overlay" class="absolute inset-0 bg-slate-950/90 flex flex-col items-center justify-center p-6 text-center z-20">

                <button id="touch-right" class="w-14 h-14 bg-slate-700 active:bg-amber-600 border-2 border-slate-500 rounded-xl flex items-center justify-center text-xl shadow-lg">➡️</button>

            </div>
        </div>

        <!-- Desktop Instructions -->
        <div class="hidden sm:flex justify-center space-x-6 text-[10px] text-slate-400 mt-3">
            <span>⌨️ Gerak: <b>Panah Kiri / Kanan</b> atau <b>A / D</b></span>
            <span>🚀 Lompat: <b>Spasi</b> atau <b>Panah Atas</b></span>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Set internal canvas resolution for retro crisp pixel look
        canvas.width = 640;
        canvas.height = 480;

        // Game States
        let gameState = 'START'; // START, PLAYING, PAUSED, GAMEOVER, VICTORY
        let score = 0;
        let coins = 0;
        let lives = 3;
        let currentLevel = 1;
        let soundEnabled = true;

        // Input Mapping
        const keys = { left: false, right: false, jump: false };

        // Audio Context for Procedural Retro Sound Effects & BGM
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!soundEnabled || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;

                if (type === 'jump') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(400, now + 0.15);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'coin') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(500, now);
                    osc.frequency.setValueAtTime(800, now + 0.08);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else if (type === 'hit') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(120, now);
                    osc.frequency.linearRampToValueAtTime(40, now + 0.2);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else if (type === 'win') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.setValueAtTime(400, now + 0.1);
                    osc.frequency.setValueAtTime(550, now + 0.2);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                }
            } catch(e) {}
        }

        class Player {
            constructor() {
                this.reset();
                this.width = 24;
                this.height = 32;
            }
            reset() {
                this.x = 50;
                this.y = 350;
                this.vx = 0;
                this.vy = 0;
                this.speed = 3.5;
                this.jumpPower = -10;
                this.gravity = 0.45;
                this.grounded = false;
                this.facing = 1; // 1: right, -1: left
            }
            update() {
                if (keys.left) {
                    this.vx = -this.speed;
                    this.facing = -1;
                } else if (keys.right) {
                    this.vx = this.speed;
                    this.facing = 1;
                } else {
                    this.vx = 0;
                }

                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;

                // Screen boundaries
                if (this.x < 0) this.x = 0;
                if (this.x + this.width > canvas.width) this.x = canvas.width - this.width;

                // Bottom pit death
                if (this.y > canvas.height) {
                    this.die();
                }
            }
            draw() {
                ctx.save();
                // Hero body (Retro Pixel Knight look)
                ctx.fillStyle = '#f59e0b'; // Gold armor
                ctx.fillRect(this.x, this.y + 8, this.width, this.height - 8);
                // Helmet
                ctx.fillStyle = '#3b82f6'; 
                ctx.fillRect(this.x, this.y, this.width, 12);
                // Visor
                ctx.fillStyle = '#93c5fd';
                if (this.facing === 1) {
                    ctx.fillRect(this.x + 14, this.y + 4, 8, 4);
                } else {
                    ctx.fillRect(this.x + 2, this.y + 4, 8, 4);
                }
                // Boots
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(this.x + 2, this.y + this.height - 4, 8, 4);
                ctx.fillRect(this.x + 14, this.y + this.height - 4, 8, 4);
                ctx.restore();
            }
            die() {
                playSound('hit');
                lives--;
                document.getElementById('ui-lives').innerText = lives;
                if (lives <= 0) {
                    triggerGameOver();
                } else {
                    this.reset();
                }
            }
        }

        let player = new Player();
        let platforms = [];
        let coinsList = [];
        let enemies = [];
        let exitPortal = null;

        function loadLevel(levelNum) {
            platforms = [];
            coinsList = [];
            enemies = [];

            if (levelNum === 1) {
                // Ground floor segments
                platforms = [
                    { x: 0, y: 420, w: 640, h: 60, type: 'ground' },
                    { x: 180, y: 320, w: 120, h: 20, type: 'platform' },
                    { x: 360, y: 230, w: 120, h: 20, type: 'platform' },
                    { x: 140, y: 150, w: 100, h: 20, type: 'platform' },
                    { x: 520, y: 340, w: 100, h: 20, type: 'platform' }
                ];
                coinsList = [
                    { x: 230, y: 280, collected: false },
                    { x: 410, y: 190, collected: false },
                    { x: 180, y: 110, collected: false },
                    { x: 560, y: 300, collected: false }
                ];
                enemies = [
                    { x: 220, y: 390, w: 24, h: 30, minX: 180, maxX: 280, speed: 1.5, dir: 1 }
                ];
                exitPortal = { x: 570, y: 280, w: 30, h: 60 };
            } else if (levelNum === 2) {
                platforms = [
                    { x: 0, y: 420, w: 250, h: 60, type: 'ground' },
                    { x: 350, y: 420, w: 290, h: 60, type: 'ground' }, // Gap in middle
                    { x: 120, y: 320, w: 90, h: 20, type: 'platform' },
                    { x: 260, y: 240, w: 120, h: 20, type: 'platform' },
                    { x: 450, y: 160, w: 100, h: 20, type: 'platform' },
                    { x: 80, y: 150, w: 90, h: 20, type: 'platform' }
                ];
                coinsList = [
                    { x: 150, y: 280, collected: false },
                    { x: 310, y: 200, collected: false },
                    { x: 490, y: 120, collected: false },
                    { x: 110, y: 110, collected: false }
                ];
                enemies = [
                    { x: 400, y: 390, w: 24, h: 30, minX: 360, maxX: 600, speed: 2, dir: 1 },
                    { x: 100, y: 290, w: 24, h: 30, minX: 120, maxX: 200, speed: 1, dir: 1 }
                ];
                exitPortal = { x: 570, y: 100, w: 30, h: 60 };
            } else if (levelNum === 3) {
                // Harder Dungeon Level
                platforms = [
                    { x: 0, y: 420, w: 640, h: 60, type: 'ground' },
                    { x: 100, y: 330, w: 80, h: 20, type: 'platform' },
                    { x: 240, y: 260, w: 80, h: 20, type: 'platform' },
                    { x: 380, y: 190, w: 80, h: 20, type: 'platform' },
                    { x: 200, y: 120, w: 100, h: 20, type: 'platform' }
                ];
                coinsList = [
                    { x: 130, y: 290, collected: false },
                    { x: 270, y: 220, collected: false },
                    { x: 410, y: 150, collected: false },
                    { x: 240, y: 80, collected: false }
                ];
                enemies = [
                    { x: 150, y: 390, w: 24, h: 30, minX: 50, maxX: 300, speed: 2.2, dir: 1 },
                    { x: 400, y: 390, w: 24, h: 30, minX: 350, maxX: 600, speed: 2.5, dir: -1 },
                    { x: 250, y: 230, w: 24, h: 30, minX: 240, maxX: 310, speed: 1.5, dir: 1 }
                ];
                exitPortal = { x: 230, y: 60, w: 30, h: 60 };
            }
            player.reset();
        }

        function checkCollisions() {
            player.grounded = false;

            // Platform collisions
            for (let p of platforms) {
                // Check landing on top of platform
                if (
                    player.x + player.width > p.x &&
                    player.x < p.x + p.w &&
                    player.y + player.height >= p.y &&
                    player.y + player.height - player.vy <= p.y + 5 &&
                    player.vy >= 0
                ) {
                    player.y = p.y - player.height;
                    player.vy = 0;
                    player.grounded = true;
                }
            }

            // Coin collections
            for (let c of coinsList) {
                if (!c.collected &&
                    player.x + player.width > c.x &&
                    player.x < c.x + 16 &&
                    player.y + player.height > c.y &&
                    player.y < c.y + 16
                ) {
                    c.collected = true;
                    coins++;
                    score += 100;
                    document.getElementById('ui-coins').innerText = coins;
                    playSound('coin');
                }
            }

            // Enemy collisions & stomping mechanics
            for (let e of enemies) {
                // Move enemy
                e.x += e.speed * e.dir;
                if (e.x < e.minX || e.x + e.w > e.maxX) {
                    e.dir *= -1;
                }

                // Check player vs enemy intersection
                if (
                    player.x + player.width > e.x &&
                    player.x < e.x + e.w &&
                    player.y + player.height > e.y &&
                    player.y < e.y + e.h
                ) {
                    // Stomp enemy from above
                    if (player.vy > 0 && player.y + player.height - player.vy <= e.y + 12) {
                        player.vy = -7; // bounce
                        score += 200;
                        // remove enemy
                        enemies = enemies.filter(item => item !== e);
                        playSound('coin');
                    } else {
                        // Player takes damage
                        player.die();
                    }
                }
            }

            // Exit portal check (complete level)
            if (exitPortal &&
                player.x + player.width > exitPortal.x &&
                player.x < exitPortal.x + exitPortal.w &&
                player.y + player.height > exitPortal.y &&
                player.y < exitPortal.y + exitPortal.h
            ) {
                nextLevel();
            }
        }

        function nextLevel() {
            playSound('win');
            currentLevel++;
            if (currentLevel > 3) {
                triggerVictory();
            } else {
                document.getElementById('ui-level').innerText = currentLevel;
                loadLevel(currentLevel);
            }
        }

        function drawScene() {
            // Clear screen with dungeon dark background gradient
            const bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bgGrad.addColorStop(0, '#090d16');
            bgGrad.addColorStop(1, '#1e1b4b');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Background Dungeon Pillars/Bricks
            ctx.fillStyle = '#172033';
            ctx.fillRect(50, 50, 80, 370);
            ctx.fillRect(510, 50, 80, 370);

            // Draw Platforms
            for (let p of platforms) {
                ctx.fillStyle = p.type === 'ground' ? '#334155' : '#475569';
                ctx.fillRect(p.x, p.y, p.w, p.h);
                // Platform stone texture detail line
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(p.x, p.y, p.w, 4);
            }

            // Draw Coins (Rotating sparkle effect approximation)
            for (let c of coinsList) {
                if (!c.collected) {
                    ctx.fillStyle = '#facc15';
                    ctx.beginPath();
                    ctx.arc(c.x + 8, c.y + 8, 7, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#fef08a';
                    ctx.fillRect(c.x + 6, c.y + 5, 4, 6);
                }
            }

            // Draw Exit Portal (Magical Gate)
            if (exitPortal) {
                ctx.fillStyle = '#a855f7';
                ctx.fillRect(exitPortal.x, exitPortal.y, exitPortal.w, exitPortal.h);
                ctx.fillStyle = '#d8b4fe';
                ctx.fillRect(exitPortal.x + 5, exitPortal.y + 5, exitPortal.w - 10, exitPortal.h - 10);
            }

            // Draw Enemies (Red Slime Monsters)
            for (let e of enemies) {
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(e.x, e.y + 10, e.w, e.h - 10);
                // Eyes
                ctx.fillStyle = '#fee2e2';
                ctx.fillRect(e.x + 4, e.y + 14, 4, 4);
                ctx.fillRect(e.x + 16, e.y + 14, 4, 4);
            }

            // Draw Player
            player.draw();
        }

        function gameLoop() {
            if (gameState === 'PLAYING') {
                player.update();
                checkCollisions();
                drawScene();
            }
            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            initAudio();
            gameState = 'PLAYING';
            score = 0;
            coins = 0;
            lives = 3;
            currentLevel = 1;
            document.getElementById('ui-lives').innerText = lives;
            document.getElementById('ui-coins').innerText = coins;
            document.getElementById('ui-level').innerText = currentLevel;
            document.getElementById('game-overlay').classList.add('hidden');
            loadLevel(currentLevel);
        }

        function triggerGameOver() {
            gameState = 'GAMEOVER';
            const overlay = document.getElementById('game-overlay');
            document.getElementById('overlay-title').innerText = 'GAME OVER';
            document.getElementById('overlay-desc').innerText = `Kamu kalah di Level ${currentLevel}. Skor Akhir: ${score}`;
            document.getElementById('btn-start').innerText = 'COBA LAGI';
            overlay.classList.remove('hidden');
        }

        function triggerVictory() {
            gameState = 'VICTORY';
            playSound('win');
            const overlay = document.getElementById('game-overlay');
            document.getElementById('overlay-title').innerText = 'SELAMAT! MENANG';
            document.getElementById('overlay-desc').innerText = `Kamu berhasil menaklukkan semua Dungeon! Total Koin: ${coins}, Skor: ${score}`;
            document.getElementById('btn-start').innerText = 'MAIN LAGI';
            overlay.classList.remove('hidden');
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
            if ((e.code === 'Space' || e.code === 'ArrowUp') && player.grounded) {
                player.vy = player.jumpPower;
                player.grounded = false;
                playSound('jump');
                e.preventDefault();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
        });

        // Touch Control Bindings
        const setupTouchBtn = (id, keyName, isJump = false) => {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => {
                e.preventDefault();
                initAudio();
                if (isJump && player.grounded) {
                    player.vy = player.jumpPower;
                    player.grounded = false;
                    playSound('jump');
                } else {
                    keys[keyName] = true;
                }
            });
            el.addEventListener('touchend', (e) => {
                e.preventDefault();
                if (!isJump) keys[keyName] = false;
            });
        };

        setupTouchBtn('touch-left', 'left');
        setupTouchBtn('touch-right', 'right');
        setupTouchBtn('touch-jump', null, true);

        // UI Buttons
        document.getElementById('btn-start').addEventListener('click', startGame);
        
        document.getElementById('btn-sound').addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            document.getElementById('btn-sound').innerText = soundEnabled ? '🔊' : '🔇';
        });

        document.getElementById('btn-pause').addEventListener('click', () => {
            if (gameState === 'PLAYING') {
                gameState = 'PAUSED';
                document.getElementById('overlay-title').innerText = 'DI-PAUSE';
                document.getElementById('overlay-desc').innerText = 'Game sedang dijeda.';
                document.getElementById('btn-start').innerText = 'LANJUTKAN';
                document.getElementById('game-overlay').classList.remove('hidden');
            } else if (gameState === 'PAUSED') {
                gameState = 'PLAYING';
                document.getElementById('game-overlay').classList.add('hidden');
            }
        });

        // Start animation loop
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
